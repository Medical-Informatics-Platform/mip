name: Mirror to Ebrains

on:
  push:
    branches: [ master ]
    tags:
    - '*'

# git-sync clones the public source repo and pushes to GitLab with the
# destination credential. It does not write to this repository.
permissions:
  contents: read

jobs:
  to_ebrains:
    runs-on: ubuntu-latest
    steps:
      - name: syncmaster
        uses: wei/git-sync@v3
        with:
          source_repo: "Medical-Informatics-Platform/mip"
          source_branch: "master"
          destination_repo: "https://ghpusher:${{ secrets.EBRAINS_GITLAB_ACCESS_TOKEN }}@gitlab.ebrains.eu/hbp-mip/mip-deployment.git"
          destination_branch: "master"

      - name: synctags
        uses: wei/git-sync@v3
        with:
          source_repo: "Medical-Informatics-Platform/mip"
          source_branch: "refs/tags/*"
          destination_repo: "https://ghpusher:${{ secrets.EBRAINS_GITLAB_ACCESS_TOKEN }}@gitlab.ebrains.eu/hbp-mip/mip-deployment.git"
          destination_branch: "refs/tags/*"
