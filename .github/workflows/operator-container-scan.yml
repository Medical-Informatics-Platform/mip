name: Operator container scanning

on:
  pull_request:
    paths:
      - operator/**
      - ci/**
      - .github/workflows/operator-container-scan.yml
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # weekly scan, every Monday 02:00 UTC

jobs:
  container-scan:
    name: Container Vulnerability Scanning (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for uploading results to github security
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mip-notebook-operator
            context: operator
            dockerfile: operator/Dockerfile
            cache-scope: operator
    env:
      IMAGE_NAME: ${{ matrix.image }}:testing
      DOCKERFILE: ${{ matrix.dockerfile }}
      CONTAINER_SCAN_MERGED_SARIF_OUTPUT: container-scan-${{ matrix.image }}-merged.sarif

      # SCA / CVE
      TRIVY_IGNOREFILE: ci/suppress_trivy.yaml
      OSV_IGNOREFILE: ci/suppress_osv_scanner.toml
      TRIVY_SCA_SARIF_OUTPUT: sca-trivy-container.sarif
      OSV_SCA_SARIF_OUTPUT: sca-osv-container.sarif

      # SAST / Linting
      SEMGREP_CONFIG_RULESETS: >-
              semgrep-rules/dockerfile auto
      OPENGREP_SAST_SARIF_OUTPUT: sast-opengrep-dockerfile.sarif
      HADOLINT_SAST_SARIF_OUTPUT: sast-hadolint-dockerfile.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: '3.15.1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      # Reads the same GHA layer cache as operator-ci.yml, so unchanged layers are not rebuilt.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}

      - name: Setup tools
        run: |
          bash ci/setup-tools.sh \
          --install-tool trivy,osv-scanner,opengrep,hadolint,semgrep-rules

      - name: Run SAST scanning
        run: python ci/container_scan.py --scan-type sast

      - name: Run SCA scanning
        if: ${{ !cancelled() }}
        run: python ci/container_scan.py --scan-type sca --image ${{ env.IMAGE_NAME }}

      - name: Merge all SARIF reports
        if: ${{ !cancelled() }}
        run: |
          python ci/container_scan.py \
            --merge-sarif "${{ env.TRIVY_SCA_SARIF_OUTPUT }}" "${{ env.OSV_SCA_SARIF_OUTPUT }}" "${{ env.OPENGREP_SAST_SARIF_OUTPUT }}" "${{ env.HADOLINT_SAST_SARIF_OUTPUT }}" \
            --merge-output "${{ env.CONTAINER_SCAN_MERGED_SARIF_OUTPUT }}"

      - name: Upload merged SARIF to GitHub Security tab
        if: ${{ !cancelled() && hashFiles(env.CONTAINER_SCAN_MERGED_SARIF_OUTPUT) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ env.CONTAINER_SCAN_MERGED_SARIF_OUTPUT }}
          category: container-scan-${{ matrix.image }}

      - name: Encrypt SARIF report
        id: encrypt
        if: ${{ !cancelled() && hashFiles(env.CONTAINER_SCAN_MERGED_SARIF_OUTPUT) != '' }}
        env:
          PW: ${{ secrets.ARTIFACT_PASSWORD }}
          OUT: ${{ env.CONTAINER_SCAN_MERGED_SARIF_OUTPUT }}.gpg
        run: |
          if [ -z "$PW" ]; then
            echo "::warning title=SARIF report not uploaded::ARTIFACT_PASSWORD is not available in this run (Dependabot, Renovate or fork PR). Skipping encryption and upload."
            rm -f -- "$CONTAINER_SCAN_MERGED_SARIF_OUTPUT"
            exit 0
          fi
          printf '%s' "$PW" | gpg --symmetric --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --no-symkey-cache \
            --cipher-algo AES256 \
            --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "$OUT" -- "$CONTAINER_SCAN_MERGED_SARIF_OUTPUT"
          rm -f -- "$CONTAINER_SCAN_MERGED_SARIF_OUTPUT"
          echo "encrypted=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted SARIF artifact
        if: ${{ !cancelled() && steps.encrypt.outputs.encrypted != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-sarif-report-${{ matrix.image }}
          path: ${{ steps.encrypt.outputs.encrypted }}
          retention-days: 30
          if-no-files-found: error
