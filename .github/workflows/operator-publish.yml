name: Publish operator image

on:
  release:
    types: [published]

env:
  HARBOR_REGISTRY: docker-registry.ebrains.eu
  DOCKER_BUILDKIT: 1
  DOCKER_CLIENT_TIMEOUT: 300
  COMPOSE_HTTP_TIMEOUT: 300
  RETRY_ATTEMPTS: "4"
  RETRY_SLEEP: "10"

# Registries use their own credentials; GITHUB_TOKEN only reads.
permissions:
  contents: read
  # The called scan workflows upload their SARIF to the Security tab.
  security-events: write

jobs:
  test:
    uses: ./.github/workflows/operator-ci.yml

  sca:
    name: Operator SCA
    uses: ./.github/workflows/operator-sca.yml
    secrets: inherit

  container-scan:
    name: Operator container scanning
    uses: ./.github/workflows/operator-container-scan.yml
    secrets: inherit

  sast:
    name: Operator SAST
    uses: ./.github/workflows/operator-sast.yml
    secrets: inherit

  secrets-scan:
    name: Operator secret scanning
    uses: ./.github/workflows/operator-secrets-scan.yml
    secrets: inherit

  build_and_push:
    name: Build ${{ matrix.image }} image and push to registries
    needs: [test, sca, container-scan, sast, secrets-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mip-notebook-operator
            context: operator
            dockerfile: operator/Dockerfile
            cache-scope: operator

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Harbor connectivity probe
        run: |
          set -x
          getent hosts ${{ env.HARBOR_REGISTRY }} || true
          curl -vI --connect-timeout 10 https://${{ env.HARBOR_REGISTRY }}/v2/ || true

      - name: Disable IPv6 (job-scoped)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to EBRAINS HARBOR (retry)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for i in $(seq 1 ${{ env.RETRY_ATTEMPTS }}); do
            printf '%s' "$HARBOR_PASSWORD" | \
            docker login ${{ env.HARBOR_REGISTRY }} \
              -u "$HARBOR_USERNAME" --password-stdin && exit 0
            echo "Harbor login attempt $i failed; retrying in ${{ env.RETRY_SLEEP }}s..."
            sleep ${{ env.RETRY_SLEEP }}
          done
          echo "Harbor login failed after ${{ env.RETRY_ATTEMPTS }} attempts" >&2
          exit 1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with:
          images: |
            hbpmip/${{ matrix.image }}
            ${{ env.HARBOR_REGISTRY }}/medical-informatics-platform/${{ matrix.image }}

      # Shares the GHA layer cache with operator-ci.yml and operator-container-scan.yml.
      - name: Build ${{ matrix.image }} docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=max
