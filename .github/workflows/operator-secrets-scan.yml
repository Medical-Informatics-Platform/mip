name: Operator secret scanning (gitleaks)

on:
  pull_request:
    paths:
      - operator/**
      - ci/**
      - .github/workflows/operator-secrets-scan.yml
  push:
    branches:
      - master
    paths:
      - operator/**
      - ci/**
      - .github/workflows/operator-secrets-scan.yml
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_SARIF_OUTPUT: gitleaks.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: bash ci/setup-tools.sh --install-tool gitleaks

      - name: Run gitleaks
        run: >
          gitleaks dir .
          --redact
          --report-format sarif
          --report-path "$GITLEAKS_SARIF_OUTPUT"

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles(env.GITLEAKS_SARIF_OUTPUT) != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.GITLEAKS_SARIF_OUTPUT }}
          category: gitleaks
