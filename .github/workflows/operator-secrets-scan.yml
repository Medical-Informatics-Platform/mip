name: Operator secret scanning (gitleaks)

on:
  pull_request:
    paths:
      - operator/**
      - ci/**
      - .github/workflows/operator-secrets-scan.yml
  push:
    branches:
      - master
    paths:
      - operator/**
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_SARIF_OUTPUT: gitleaks.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: bash ci/setup-tools.sh --install-tool gitleaks

      - name: Install and run gitleaks
        run: >
          gitleaks dir operator
          --redact
          --report-format sarif
          --report-path "$GITLEAKS_SARIF_OUTPUT"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ env.GITLEAKS_SARIF_OUTPUT }}
          category: gitleaks
