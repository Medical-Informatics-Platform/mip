services:
  exaflow_aggregation_server:
    image: madgik/exaflow_aggregation_server:${EXAFLOW}
    ports:
      - "50051:50051"
    environment:
      PORT: 50051
      MAX_GRPC_CONNECTIONS: 10
      MAX_WAIT_FOR_AGGREGATION_INPUTS: 30
      LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.13

  rabbitmq:
    image: rabbitmq:4.4.1
    environment:
      RABBITMQ_DEFAULT_USER: mip
      RABBITMQ_DEFAULT_PASS: mip
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.14

  exaflow_controller:
    image: madgik/exaflow_controller:${EXAFLOW}
    ports:
      - "5000:5000"
    environment:
      NODE_IDENTIFIER: controller
      FEDERATION: dementia
      LOG_LEVEL: INFO
      FRAMEWORK_LOG_LEVEL: INFO
      DEPLOYMENT_TYPE: LOCAL
      WORKER_LANDSCAPE_AGGREGATOR_UPDATE_INTERVAL: 30
      WORKER_TASKS_TIMEOUT: 30
      MAX_CONCURRENT_EXPERIMENTS: 32
      WORKERS_CONFIG_FILE: /opt/config/workers_config.json
      WORKERS_DNS: ""
      WORKERS_PORT: ""
      AGGREGATION_SERVER_ENABLED: true
      AGGREGATION_SERVER_DNS: 172.28.0.13:50051
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://mip:mip@rabbitmq:5672/%2F
    depends_on:
      exaflow_aggregation_server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/opt/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.10

  exaflow_local_worker1:
    image: madgik/exaflow_worker:${EXAFLOW}
    environment:
      WORKER_IDENTIFIER: localworker1
      FEDERATION: dementia
      LOG_LEVEL: INFO
      FRAMEWORK_LOG_LEVEL: INFO
      DUCKDB_PATH: /tmp/localworker1.duckdb
      DATA_PATH: /opt/data
      CONTROLLER_IP: 172.28.0.10
      CONTROLLER_PORT: 5000
      WORKER_TASKS_TIMEOUT: 30
      PROTECT_LOCAL_DATA: false
      GRPC_IP: 172.28.0.12
      GRPC_PORT: 5671
      GRPC_MAX_WORKERS: 36
      AGGREGATION_SERVER_ENABLED: true
      AGGREGATION_SERVER_DNS: 172.28.0.13:50051
    depends_on:
      - exaflow_controller
      - exaflow_aggregation_server
    volumes:
      - ./data:/opt/data
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.12

  platform_backend_db:
    image: postgres:18.7-alpine
    volumes:
      - ./.stored_data/platform_backenddb:/var/lib/postgresql
      - ../kubernetes/files/platform-backend-db-init.sh:/docker-entrypoint-initdb.d/10-bootstrap-platform-db.sh:ro
    hostname: platform_backend_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
      PLATFORM_DB_NAME: portal
      PLATFORM_DB_USER: portal
      PLATFORM_DB_PASSWORD: portalpwd
    command: -p 5433
    ports:
      - '5433:5433'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  platform-backend:
    image: hbpmip/platform-backend:${PLATFORM_BACKEND}
    ports:
      - '8080:8080'
      - '8089:8089'
    depends_on:
      platform_backend_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      exaflow_controller:
        condition: service_started
    environment:
      ### LOGGER ###
      LOG_LEVEL: INFO
      LOG_LEVEL_FRAMEWORK: INFO
      FEDERATION: dementia
      ### Database ###
      PLATFORM_DB_URL: jdbc:postgresql://platform_backend_db:5433/portal
      PLATFORM_DB_SERVER: platform_backend_db:5433
      PLATFORM_DB_USER: portal
      PLATFORM_DB_PASSWORD: portalpwd
      ### Exaflow ###
      ALGORITHM_UPDATE_INTERVAL: 30     # seconds
      EXAFLOW_URL: http://exaflow_controller:5000
      RABBITMQ_URL: amqp://mip:mip@rabbitmq:5672/%2F
      PLATFORM_UI_BASE_URL: "${PLATFORM_UI_BASE_URL:-http://localhost}"
      ### Keycloak (external) ###
      AUTHENTICATION: "${AUTHENTICATION}"
      KEYCLOAK_AUTH_URL: "${KEYCLOAK_AUTH_URL}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      KEYCLOAK_CLI_CLIENT_ID: "${KEYCLOAK_CLI_CLIENT_ID:-}"
      KEYCLOAK_REQUIRED_AUDIENCE: "${KEYCLOAK_REQUIRED_AUDIENCE:-}"
      KEYCLOAK_CLI_REQUIRE_DPOP: "${KEYCLOAK_CLI_REQUIRE_DPOP:-false}"
      KEYCLOAK_SSL_REQUIRED: "${KEYCLOAK_SSL_REQUIRED}"
    volumes:
      - ./config:/opt/platform/api
    restart: unless-stopped

  platform_ui:
    image: hbpmip/platform-ui:${PLATFORM_UI}
    ports:
      - "80:80"
    environment:
      PLATFORM_BACKEND_SERVER: platform-backend:8080
      PLATFORM_BACKEND_CONTEXT: services
      NOTEBOOK_ENABLED: 0
      # nginx resolves this at start; the dev stack has no JupyterHub.
      JUPYTER_SERVER: 127.0.0.1:80
      JUPYTER_CONTEXT: notebook
      MIP_VERSION: "${MIP}"
      KEYCLOAK_ORIGIN: "${KEYCLOAK_ORIGIN:-}"
    depends_on:
      - platform-backend
    restart: unless-stopped

  mip_jupyter:
    image: hbpmip/mip-jupyter:${MIP_JUPYTER}
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      PLATFORM_BACKEND_URL: http://platform-backend:8080/services
      MIP_TOKEN: "${MIP_TOKEN:-}"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-dev}"
      MIP_NOTEBOOK: ${MIP_NOTEBOOK:-Welcome.ipynb}
      JUPYTER_ENABLE_LAB: "yes"
    # The entrypoint links examples/ only when .mip-examples is itself a mount point,
    # as the operator's claim mount is in the clusters.
    tmpfs:
      - /home/jovyan/work/.mip-examples:mode=755
    volumes:
      # Optional: a local checkout of the public mip-examples repo, read-only, at the
      # path the notebook operator uses in the clusters.
      - ${MIP_EXAMPLES_DIR:-./mip-examples}:/home/jovyan/work/.mip-examples/examples:ro
    depends_on:
      - platform-backend
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
