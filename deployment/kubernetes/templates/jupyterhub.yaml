{{- $namespace := default "default" .Release.Namespace -}}
{{- $jupyterHub := index .Values "jupyterhub" -}}
{{- $platformUi := index .Values "platform-ui" -}}
{{- $notebook := default (dict) $platformUi.notebook -}}
{{- if eq (toString $notebook.enabled) "true" -}}
{{- if eq (toString .Values.keycloak.enabled) "false" -}}
{{- fail "platform-ui.notebook.enabled requires keycloak.enabled: JupyterHub authenticates through Keycloak" -}}
{{- end -}}
{{- $hubImage := printf "%s:%s" $jupyterHub.image.repository $jupyterHub.image.tag -}}
{{- $singleuserImage := printf "%s:%s" $jupyterHub.singleuser.image.repository $jupyterHub.singleuser.image.tag -}}
{{- $storageClass := include "mip.storageClass" . -}}
{{- $keycloakRealm := default "MIP" .Values.keycloak.realm -}}
{{- $keycloakAuthUrl := include "mip.keycloakAuthUrl" . -}}
{{- $publicHost := .Values.global.publicHost -}}
{{- $spawner := default "kubespawner" $jupyterHub.spawner -}}
{{- if not (has $spawner (list "kubespawner" "operator" "operator-api")) -}}
{{- fail (printf "jupyterhub.spawner must be kubespawner, operator or operator-api, not %q" $spawner) -}}
{{- end -}}
{{- /* Both operator modes render the NotebookProfile; operator-api also drops the hub's Kubernetes access. */ -}}
{{- $useOperator := has $spawner (list "operator" "operator-api") -}}
{{- $useOperatorApi := eq $spawner "operator-api" -}}
{{- $operatorApi := default (dict) $jupyterHub.operatorApi -}}
{{- $apiProxy := default (dict) $jupyterHub.apiProxy -}}
{{- $useApiProxy := eq (toString $apiProxy.enabled) "true" -}}
{{- if and $useApiProxy $useOperatorApi -}}
{{- fail "jupyterhub.apiProxy.enabled does not apply to jupyterhub.spawner: operator-api, which has no Kubernetes client: unset it" -}}
{{- end -}}
{{- if and $useApiProxy (not $useOperator) -}}
{{- fail "jupyterhub.apiProxy.enabled requires jupyterhub.spawner: operator: the proxy only forwards the operator spawner's requests" -}}
{{- end -}}
{{- if $jupyterHub.cryptKey }}
---
# Without jupyterhub.cryptKey, create the secret out-of-band (see README) so the
# key stays stable across ArgoCD syncs and `helm template` renders.
apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-crypt
  namespace: {{ $namespace }}
type: Opaque
stringData:
  crypt-key: {{ $jupyterHub.cryptKey | quote }}
{{- end }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-claim0
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: {{ $storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}

{{- /* operator-api: the hub has no Kubernetes permissions at all. */ -}}
{{- if and (ne (toString $jupyterHub.rbac.create) "false") (not $useOperatorApi) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}
rules:
{{- if $useOperator }}
  # The MIP notebook operator builds the pods from the NotebookProfile below;
  # the hub only asks for them. secrets: create (no read/update/delete) is for
  # the per-server API token Secret, owned by its Notebook.
  - apiGroups: ["notebooks.mip.ebrains.eu"]
    resources: ["notebooks"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
{{- else }}
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: jupyterhub
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyterhub
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}
spec:
  selector:
    app: jupyterhub
    component: hub
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: hub-api
      protocol: TCP
      port: 8081
      targetPort: 8081

{{- if eq (toString $jupyterHub.ingress.enabled) "true" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}
spec:
  ingressClassName: {{ default "nginx" (default (dict) $platformUi.ingress).className | quote }}
  rules:
    - host: notebooks.{{ .Values.global.publicHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyterhub
                port:
                  number: 80
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  namespace: {{ $namespace }}
  labels:
    app: jupyterhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterhub
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jupyterhub
        component: hub
    spec:
      serviceAccountName: jupyterhub
{{- if $useApiProxy }}
      # kube-api below replaces the automounted token, so the hub's Kubernetes
      # client talks to the notebook API proxy instead of the API server.
      automountServiceAccountToken: false
{{- else if $useOperatorApi }}
      # No Kubernetes credentials: the hub only holds the audience-bound token
      # in notebook-api below, which the API server rejects.
      automountServiceAccountToken: false
{{- end }}
{{- if eq (toString .Values.cluster.managed) "false" }}
      nodeSelector:
        master: "true"
{{- end }}
      volumes:
        - name: jupyterhub-claim0
          persistentVolumeClaim:
            claimName: jupyterhub-claim0
{{- if $useApiProxy }}
        # Same layout as the automounted ServiceAccount volume, with the proxy's
        # CA instead of the cluster's. 3607 is what the kubelet itself requests:
        # the API server extends such tokens, so the hub's long-lived client,
        # which reads the token once, keeps working. Any other value yields a
        # token that really expires.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ $apiProxy.tokenExpirationSeconds }}
              - configMap:
                  name: {{ $apiProxy.caConfigMap | quote }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
{{- if $useOperatorApi }}
        # Token for the notebook operator's spawn API. Its audience is not the
        # API server's, so the API server rejects it; the kubelet rotates it.
        - name: notebook-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $operatorApi.audience | quote }}
                  expirationSeconds: {{ $operatorApi.tokenExpirationSeconds }}
              - configMap:
                  name: {{ $operatorApi.caConfigMap | quote }}
                  items:
                    - key: ca.crt
                      path: ca.crt
{{- end }}
      containers:
        - name: jupyterhub
          image: {{ $hubImage | quote }}
          ports:
            - containerPort: 8000
            - containerPort: 8081
{{- with $jupyterHub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUPYTERHUB_SPAWNER
              value: {{ $spawner | quote }}
{{- if $useApiProxy }}
            # In-cluster config reads these; the proxy forwards only the
            # spawner's requests to the API server.
            - name: KUBERNETES_SERVICE_HOST
              value: {{ $apiProxy.host | quote }}
            - name: KUBERNETES_SERVICE_PORT
              value: {{ $apiProxy.port | quote }}
{{- end }}
{{- if $useOperatorApi }}
            - name: NOTEBOOK_API_URL
              value: {{ $operatorApi.url | quote }}
            - name: NOTEBOOK_API_TOKEN_FILE
              value: /var/run/secrets/mip-notebook-operator/token
            - name: NOTEBOOK_API_CA_FILE
              value: /var/run/secrets/mip-notebook-operator/ca.crt
{{- end }}
            - name: JUPYTER_SINGLEUSER_IMAGE
              value: {{ $singleuserImage | quote }}
{{- if eq (toString .Values.cluster.managed) "false" }}
            - name: JUPYTER_NODE_SELECTOR
              value: "master=true"
{{- end }}
            - name: JUPYTER_STORAGE_CLASS
              value: {{ $storageClass | quote }}
            - name: JUPYTER_STORAGE_CAPACITY
              value: {{ $jupyterHub.singleuser.storageCapacity | quote }}
            - name: JUPYTER_CPU_LIMIT
              value: {{ $jupyterHub.singleuser.resources.limits.cpu | quote }}
            - name: JUPYTER_MEM_LIMIT
              value: {{ $jupyterHub.singleuser.resources.limits.memory | quote }}
            - name: JUPYTER_CPU_GUARANTEE
              value: {{ $jupyterHub.singleuser.resources.requests.cpu | quote }}
            - name: JUPYTER_MEM_GUARANTEE
              value: {{ $jupyterHub.singleuser.resources.requests.memory | quote }}
            - name: JUPYTERHUB_LOGOUT_REDIRECT_URL
              value: {{ printf "https://%s" $publicHost | quote }}
            # Read by oauthenticator. Without it the hub derives the callback from
            # the request, which is http:// behind platform-ui nginx.
            - name: OAUTH_CALLBACK_URL
              value: {{ printf "https://%s/notebook/hub/oauth_callback" $publicHost | quote }}
{{- with $jupyterHub.codex }}
{{- if .baseUrl }}
            # jupyterhub_config.py forwards these to every singleuser pod.
            - name: CODEX_VLLM_BASE_URL
              value: {{ .baseUrl | quote }}
{{- end }}
{{- if .model }}
            - name: CODEX_VLLM_MODEL
              value: {{ .model | quote }}
{{- end }}
{{- end }}
            - name: KEYCLOAK_AUTH_URL
              value: {{ $keycloakAuthUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ $keycloakRealm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: client-secret
            - name: JUPYTERHUB_CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-crypt
                  key: crypt-key
            # The hub database lives on jupyterhub-claim0, so user servers can
            # keep running while the hub restarts. Older hub images ignore it.
            - name: JUPYTERHUB_CLEANUP_SERVERS
              value: "false"
            - name: JUPYTERHUB_CULL_IDLE_TIMEOUT
              value: {{ default 0 $jupyterHub.cullIdleTimeout | quote }}
            - name: JUPYTERHUB_CULL_EVERY
              value: {{ default 600 $jupyterHub.cullEvery | quote }}
          volumeMounts:
            - name: jupyterhub-claim0
              mountPath: /srv/jupyterhub
{{- if $useApiProxy }}
            - name: kube-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
{{- end }}
{{- if $useOperatorApi }}
            - name: notebook-api
              mountPath: /var/run/secrets/mip-notebook-operator
              readOnly: true
{{- end }}
{{- if $useOperator }}

---
# Pod template for the MIP notebook operator (mip-jupyter/operator). The hub
# cannot read or change it; the operator applies the security context itself.
apiVersion: notebooks.mip.ebrains.eu/v1alpha1
kind: NotebookProfile
metadata:
  name: default
  namespace: {{ $namespace }}
spec:
  image: {{ $singleuserImage | quote }}
  imagePullPolicy: Always
  resources:
    {{- toYaml $jupyterHub.singleuser.resources | nindent 4 }}
  storage:
    storageClassName: {{ $storageClass | quote }}
    size: {{ $jupyterHub.singleuser.storageCapacity | quote }}
    # New volumes are root-owned and not every provisioner applies fsGroup;
    # the notebook (uid 1000) must own /home/jovyan/work. Same chown init
    # container KubeSpawner ran.
    fixOwnership: true
{{- if eq (toString .Values.cluster.managed) "false" }}
  nodeSelector:
    master: "true"
{{- end }}
  env:
    - name: PLATFORM_BACKEND_URL
      value: http://platform-backend-service:8080/services
{{- with $jupyterHub.codex }}
{{- if .baseUrl }}
    - name: CODEX_VLLM_BASE_URL
      value: {{ .baseUrl | quote }}
{{- end }}
{{- if .model }}
    - name: CODEX_VLLM_MODEL
      value: {{ .model | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
