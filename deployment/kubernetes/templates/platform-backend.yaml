{{- $namespace := default "default" .Release.Namespace -}}
{{- $platformBackend := index .Values "platform-backend" -}}
{{- $authEnabled := default true .Values.keycloak.enabled -}}
{{- $authFlag := ternary "1" "0" $authEnabled -}}
{{- $publicHost := default "" .Values.global.publicHost -}}
{{- $platformUiUrl := "" -}}
{{- if $publicHost -}}
{{- $platformUiUrl = printf "https://%s" $publicHost -}}
{{- end -}}
{{- $keycloakProtocol := default "https" .Values.keycloak.protocol -}}
{{- $keycloakHost := default "" .Values.keycloak.host -}}
{{- $keycloakRealm := default "MIP" .Values.keycloak.realm -}}
{{- $keycloakAuthUrl := "" -}}
{{- if and $keycloakProtocol $keycloakHost -}}
{{- $keycloakAuthUrl = printf "%s://%s/auth/" $keycloakProtocol $keycloakHost -}}
{{- end -}}
{{- $localStorageClass := .Values.cluster.storageClasses.local -}}
{{- $managedStorageClass := .Values.cluster.storageClasses.managed -}}
{{- $backendStorageClass := ternary $managedStorageClass $localStorageClass .Values.cluster.managed -}}
---
# platform-backend PVCs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-backend-db-claim0
  namespace: {{ $namespace }}
  annotations:
    # tells Argo CD: do not prune (delete) this resource
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: {{ $backendStorageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.platformBackendDatabase.persistence.size }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-backend-claim0
  namespace: {{ $namespace }}
  annotations:
    # tells Argo CD: do not prune (delete) this resource
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: {{ $backendStorageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $platformBackend.persistence.data.size }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-backend-logs-claim0
  namespace: {{ $namespace }}
  annotations:
    # tells Argo CD: do not prune (delete) this resource
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: {{ $backendStorageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $platformBackend.persistence.logs.size }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-backend-db-init
  namespace: {{ $namespace }}
data:
  10-bootstrap-platform-db.sh: |
{{ .Files.Get "files/platform-backend-db-init.sh" | nindent 4 }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
  namespace: {{ $namespace }}
  labels:
    app: platform-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: platform-backend
    spec:
      hostname: platform-backend
      volumes:
        - name: platform-backend-db-claim0
          persistentVolumeClaim:
            claimName: platform-backend-db-claim0
        - name: platform-backend-claim0
          persistentVolumeClaim:
            claimName: platform-backend-claim0
        - name: platform-backend-logs-claim0
          persistentVolumeClaim:
            claimName: platform-backend-logs-claim0
        - name: platform-backend-db-init
          configMap:
            name: platform-backend-db-init
            defaultMode: 0755
      containers:
        - name: platform-backend-db
          image: {{ .Values.platformBackendDatabase.image.repository }}:{{ .Values.platformBackendDatabase.image.tag }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: platform-backend-db-claim0
              mountPath: /var/lib/postgresql
            - name: platform-backend-db-init
              mountPath: /opt/platform-backend-db-init
              readOnly: true
          args:
            - -p
            - "5432"
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.DB_ADMIN_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.DB_ADMIN_PASSWORD
            - name: PLATFORM_DB_NAME
              value: portal
            - name: PLATFORM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.PLATFORM_DB_USER
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.PLATFORM_DB_PASSWORD
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /opt/platform-backend-db-init/10-bootstrap-platform-db.sh

        - name: platform-backend
          image: {{ $platformBackend.image.repository }}:{{ $platformBackend.image.tag }}
          ports:
            - containerPort: 8080
            - containerPort: 8089
          volumeMounts:
            - name: platform-backend-claim0
              mountPath: /opt/platform/api
            - name: platform-backend-logs-claim0
              mountPath: /var/log/platform-backend
          env:
            - name: LOG_LEVEL
              value: {{ $platformBackend.config.logLevel | quote }}
            - name: LOG_LEVEL_FRAMEWORK
              value: {{ $platformBackend.config.logLevelFramework | quote }}
            - name: AUTHENTICATION
              value: {{ $authFlag | quote }}
            - name: PLATFORM_DB_URL
              value: jdbc:postgresql://localhost:5432/portal
            - name: PLATFORM_DB_SERVER
              value: localhost:5432
            - name: PLATFORM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.PLATFORM_DB_USER
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mip-secret
                  key: platform-backend-db.PLATFORM_DB_PASSWORD
            - name: EXAFLOW_URL
              value: {{ default "" .Values.engines.exaflow.url | quote }}
            - name: PLATFORM_UI_BASE_URL
              value: {{ $platformUiUrl | quote }}
            - name: KEYCLOAK_AUTH_URL
              value: {{ $keycloakAuthUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ $keycloakRealm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: client-secret
            - name: ALGORITHM_UPDATE_INTERVAL
              value: {{ $platformBackend.config.algorithmUpdateInterval | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: platform-backend-service
  namespace: {{ $namespace }}
  labels:
    app: platform-backend
spec:
  selector:
    app: platform-backend
  ports:
    - name: "5432"
      port: 5432
      targetPort: 5432
    - name: "8080"
      port: 8080
      targetPort: 8080
