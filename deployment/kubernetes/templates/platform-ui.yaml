{{- $namespace := default "default" .Release.Namespace -}}
{{- $platformUi := index .Values "platform-ui" -}}
{{- $ingress := default (dict) $platformUi.ingress -}}
{{- $backendHost := default "" $platformUi.backend.host -}}
{{- $backendPort := default 8080 $platformUi.backend.port -}}
{{- $backendContext := default "services" $platformUi.backend.context -}}
{{- $guide := default (dict) $platformUi.guide -}}
{{- $guideCovariate := default "Sex" $guide.covariate -}}
{{- $guideVariable := default "Age" $guide.variable -}}
{{- $notebookEnabled := default false .Values.notebook.enabled -}}
{{- $ingressEnabled := default true $ingress.enabled -}}
{{- $publicHost := default "" .Values.global.publicHost -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ui
  namespace: {{ $namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-ui
  template:
    metadata:
      labels:
        app: platform-ui
    spec:
{{- if not .Values.cluster.managed }}
      nodeSelector:
        master: "true"
{{- end }}
      containers:
        - name: platform-ui
          image: "{{ $platformUi.image.repository }}:{{ $platformUi.image.tag }}"
          ports:
            - containerPort: 80
          env:
            - name: MIP_VERSION
              value: {{ default "" .Values.mip.version | quote }}
            - name: GUIDE_COVARIATE
              value: {{ $guideCovariate | quote }}
            - name: GUIDE_VARIABLE
              value: {{ $guideVariable | quote }}
            - name: NOTEBOOK_ENABLED
              value: {{ ternary "1" "0" $notebookEnabled | quote }}
{{- if $backendHost }}
            - name: PLATFORM_BACKEND_SERVER
              value: {{ printf "%s:%v" $backendHost $backendPort | quote }}
            - name: PLATFORM_BACKEND_CONTEXT
              value: {{ $backendContext | quote }}
{{- end }}
{{- if $notebookEnabled }}
            - name: JUPYTER_SERVER
              value: {{ printf "%s:%v" (default "jupyterhub-proxy-public" .Values.notebook.server.host) (default 80 .Values.notebook.server.port) | quote }}
            - name: JUPYTER_CONTEXT
              value: {{ default "notebook" .Values.notebook.server.context | quote }}
            - name: JUPYTER_LANDING_PATH
              value: {{ default "/hub/spawn" .Values.notebook.server.landingPath | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-ui
  namespace: {{ $namespace }}
spec:
  selector:
    app: platform-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
{{- if and $ingressEnabled (not (empty $publicHost)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ui-ingress
  namespace: {{ $namespace }}
  annotations:
{{- if $ingress.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ingress.certManagerClusterIssuer | quote }}
{{- end }}
spec:
  ingressClassName: {{ default "nginx" $ingress.className | quote }}
{{- if and $ingress.tlsSecretName (not (empty $publicHost)) }}
  tls:
    - hosts:
        - {{ $publicHost }}
      secretName: {{ $ingress.tlsSecretName }}
{{- end }}
  rules:
    - host: {{ $publicHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-ui
                port:
                  number: 80
{{- end }}
