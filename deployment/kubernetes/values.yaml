cluster:
  managed: true
  storageClasses:
    local: k8s-local-storage
    managed: ceph-corbo-cephfs
global:
  publicHost: hbpmip.link
engines:
  exaflow:
    # Specifications and metadata use this HTTP URL. Analyses always run over RabbitMQ.
    url: "http://exaflow-controller-service:5000"
    # Empty fields keep the chart and backend defaults. existingSecret falls back
    # to rabbitmq.existingSecret.
    rabbitmq:
      existingSecret: ""
      urlSecretKey: "url"
      requestQueue: ""
      replyQueue: ""
      replyTimeout: ""
      publishTimeout: ""
mip:
  version: 9.2.1
platform-ui:
  image:
    repository: hbpmip/platform-ui
    tag: 2.1.1
  ingress:
    enabled: true
    className: haproxy-public
    certManagerClusterIssuer: letsencrypt-public
    tlsSecretName: platform-ui-tls
  backend:
    host: platform-backend-service
    port: 8080
    context: services
  notebook:
    enabled: true
  guide:
    covariate: Sex
    variable: Age
platform-backend:
  image:
    repository: hbpmip/platform-backend
    tag: 10.2.0
  config:
    logLevel: INFO
    logLevelFramework: INFO
    algorithmUpdateInterval: 60
  persistence:
    data:
      size: 100Mi
    logs:
      size: 1Gi

platformBackendDatabase:
  image:
    repository: postgres
    tag: 18.7-alpine
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  host: iam.ebrains.eu
  # Public Keycloak client for the mip Python client on users' own computers
  # (account-page tokens and `mip login`). Empty: not offered. See README.
  # Turns local-client sign-in on. Set only after the checklist in README
  # *Using MIP from users' own computers*.
  cliClientId: ""
  # Require DPoP-bound tokens for the local client (RFC 9449). Turn on only
  # together with DPoP on the local client in Keycloak and a DPoP-capable
  # mip-client; platform and notebook tokens keep working over Bearer.
  cliRequireDpop: false
  # When set, Bearer tokens must also name this in aud. Set it once all this federation's
  # clients issue such tokens. Empty: aud is not checked (azp always is).
  requiredAudience: ""

jupyterhub:
  # Leave empty and create the jupyterhub-crypt secret out-of-band (see README),
  # or set a stable value such as `openssl rand -hex 32`.
  cryptKey: ""
  image:
    repository: hbpmip/mip-jupyterhub
    tag: 0.2.1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: false
  # kubespawner: the hub creates notebook pods itself (Role on pods/PVCs).
  # operator: the MIP notebook operator does (operator/ in this repository); the hub
  # only creates Notebook resources. Needs the operator and its CRDs installed.
  # operator-api: as operator, but the hub asks the operator's spawn API over
  # HTTPS (see operatorApi) and holds no Kubernetes credentials or Role.
  spawner: kubespawner
  rbac:
    # false: an admin applies the hub Role/RoleBinding (e.g. with
    # mip-infra-staging's out-of-band RBAC), so the GitOps tool needs no
    # RBAC write. The rules must match the spawner mode. Ignored with
    # operator-api: no Role or RoleBinding is rendered (remove any
    # hand-applied Role/RoleBinding after switching).
    create: true
  # operator-api only. Needs hbpmip/mip-jupyterhub > 0.2.1 (0.3.0+ once
  # released; 0.2.1 falls back to KubeSpawner without credentials) and the
  # spawn API deployed (mip-infra). The hub authenticates with a ServiceAccount
  # token bound to the spawn API's audience: the kubelet rotates it, and the
  # API server rejects it. caConfigMap holds the spawn API's CA under ca.crt
  # (mip-infra copies it into each federation).
  operatorApi:
    url: https://mip-notebook-spawn-api.mip-notebooks-system.svc.cluster.local
    caConfigMap: mip-notebooks-ca
    tokenExpirationSeconds: 3600
  # OpenAI-compatible inference server for the Jupyter AI Codex persona.
  # baseUrl ends in /v1; empty leaves Codex unconfigured. Point it at a proxy
  # (e.g. mip-infra-staging's athena-proxy) to keep the real server URL out of
  # notebooks. model must equal a served id from <baseUrl>/models; empty keeps
  # the image default.
  codex:
    baseUrl: ""
    model: ""
  # Stop notebooks idle this many seconds (0 = never), checked every cullEvery
  # seconds. User files stay on their volume. Older hub images ignore both.
  cullIdleTimeout: 3600
  cullEvery: 600
  singleuser:
    image:
      repository: hbpmip/mip-jupyter
      tag: 0.2.1
    storageCapacity: 2Gi
    resources:
      requests:
        cpu: 500m
        memory: 1G
      limits:
        cpu: "1"
        memory: 4G

rabbitmq:
  # Single-node RabbitMQ 4.4.1 broker for Exaflow's AMQP analysis transport.
  # Created out of band; keys username, password, url (see README).
  existingSecret: exaflow-rabbitmq
  image:
    repository: rabbitmq
    tag: "4.4.1"
  persistence:
    size: 4Gi
  # 512Mi request / 2Gi limit so the quorum Raft WAL, a 32MiB message and
  # 256MiB queues do not trip the memory alarm or OOMKill the broker.
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
  consumerTimeoutMs: 7200000
  maxMessageSize: 33554432
  # vm_memory_high_watermark.relative. 0.6 is RabbitMQ's default (the old 0.4
  # alarm fired too early for this workload). With the 2Gi limit this alarms
  # at about 1.2Gi when the node sees the cgroup limit.
  vmMemoryHighWatermarkRelative: 0.6
  # raft.wal_max_size_bytes. 134217728 bytes is 128 MiB.
  raftWalMaxSizeBytes: 134217728
  # Extra rabbitmq.conf lines, appended as written. Any change rolls the pod.
  extraConfig: ""
