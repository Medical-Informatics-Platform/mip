cluster:
  managed: false
  storageClasses:
    local: microk8s-hostpath
    managed: ceph-corbo-cephfs
global:
  publicHost: mip.dt4h.athenarc.gr
engines:
  exaflow:
    url: "http://exaflow-controller-service:5000"
mip:
  version: 9.1.0
platform-ui:
  image:
    repository: hbpmip/platform-ui
    tag: 2.0.0_140926
  ingress:
    enabled: true
    className: public
    certManagerClusterIssuer: letsencrypt-public
    tlsSecretName: platform-ui-tls
  backend:
    host: platform-backend-service
    port: 8080
    context: services
  notebook:
    enabled: true
    server: jupyterhub:80
    context: notebook
  guide:
    covariate: Sex
    variable: Age
platform-backend:
  image:
    repository: hbpmip/platform-backend
    tag: dt4h_final
  auth:
    enforceDatasetClaims: false
  config:
    logLevel: INFO
    logLevelFramework: INFO
    algorithmUpdateInterval: 60
  persistence:
    data:
      size: 100Mi
    logs:
      size: 1Gi

platformBackendDatabase:
  image:
    repository: postgres
    tag: 18.3-alpine
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  host: inb.bsc.es
  protocol: https
  realm: datatools4heart

jupyterhub:
  enabled: true
  # Required on first install. Reused from jupyterhub-crypt on helm upgrade if left empty.
  cryptKey: ""
  image:
    repository: hbpmip/mip-jupyterhub
    tag: 0.0.1_candidate
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 1Gi
  ingress:
    enabled: false
    className: public
    tlsSecretName: jupyterhub-tls
    host: ""
  codex:
    baseUrl: http://195.251.63.150:8888/v1
    model: qwen3.8-27b-6000pro
    provider: vllm
    reasoningEffort: low
  singleuser:
    image:
      repository: hbpmip/mip-jupyter
      tag: 0.0.1_candidate
      pullPolicy: Always
    token: ""
    storageCapacity: 2Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 4Gi
