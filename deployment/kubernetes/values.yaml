cluster:
  managed: true
  storageClasses:
    local: k8s-local-storage
    managed: ceph-corbo-cephfs
global:
  publicHost: hbpmip.link
engines:
  exaflow:
    url: "http://exaflow-controller-service:5000"
mip:
  version: 9.2.0
platform-ui:
  image:
    repository: hbpmip/platform-ui
    tag: 2.0.0
  ingress:
    enabled: true
    className: haproxy-public
    certManagerClusterIssuer: letsencrypt-public
    tlsSecretName: platform-ui-tls
  backend:
    host: platform-backend-service
    port: 8080
    context: services
  notebook:
    enabled: true
  guide:
    covariate: Sex
    variable: Age
platform-backend:
  image:
    repository: hbpmip/platform-backend
    tag: 10.0.0
  config:
    logLevel: INFO
    logLevelFramework: INFO
    algorithmUpdateInterval: 60
  persistence:
    data:
      size: 100Mi
    logs:
      size: 1Gi

platformBackendDatabase:
  image:
    repository: postgres
    tag: 18.3-alpine
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  host: iam.ebrains.eu

jupyterhub:
  # Leave empty and create the jupyterhub-crypt secret out-of-band (see README),
  # or set a stable value such as `openssl rand -hex 32`.
  cryptKey: ""
  image:
    repository: hbpmip/mip-jupyterhub
    tag: 0.1.1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: false
  # kubespawner: the hub creates notebook pods itself (Role on pods/PVCs).
  # operator: the MIP notebook operator does (mip-jupyter/operator); the hub
  # only creates Notebook resources. Needs the operator and its CRDs installed.
  spawner: kubespawner
  rbac:
    # false: an admin applies the hub Role/RoleBinding (e.g. with
    # mip-infra-staging's out-of-band RBAC), so the GitOps tool needs no
    # RBAC write. The rules must match the spawner mode.
    create: true
  # OpenAI-compatible inference server for the Jupyter AI Codex persona.
  # baseUrl ends in /v1; empty leaves Codex unconfigured. Point it at a proxy
  # (e.g. mip-infra-staging's athena-proxy) to keep the real server URL out of
  # notebooks. model must equal a served id from <baseUrl>/models; empty keeps
  # the image default.
  codex:
    baseUrl: ""
    model: ""
  singleuser:
    image:
      repository: hbpmip/mip-jupyter
      tag: 0.1.1
    storageCapacity: 2Gi
    resources:
      requests:
        cpu: 500m
        memory: 1G
      limits:
        cpu: "1"
        memory: 4G
