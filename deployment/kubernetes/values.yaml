cluster:
  namespace: default
  managed: false
  storageClasses:
    local: k8s-local-storage
    managed: ceph-corbo-cephfs
network:
  externalIP: ""
  link: proxied
  externalProtocol: https
  publicProtocol: https
  publicHost: mip.dt4h.athenarc.gr
engines:
  exaflow:
    url: "http://exaflow-controller-service:5000"
    image:
      repository: madgik/exaflow
      tag: 1.0.0
mip:
  displayName: MIP
  version: 9.0.2
datacatalog:
  protocol: https
  host: ""
platform-ui:
  image:
    repository: hbpmip/platform-ui
    tag: 1.0.1
  service:
    nodePort: 30080
  ingress:
    enabled: true
    className: public
    certManagerClusterIssuer: letsencrypt-public
    certManager:
      createClusterIssuer: true
      acmeServer: https://acme-v02.api.letsencrypt.org/directory
      accountKeySecretName: letsencrypt-public-account-key
    tlsSecretName: platform-ui-tls
    redirectRootTo: /home
  backend:
    host: platform-backend-service
    port: 8080
    context: services
  config:
    errorLogLevel: ERROR
    datacatalog:
      protocol: https
      host: ""
    matomo:
      enabled: false
      url: ""
      siteId: ""
platform-backend:
  image:
    repository: hbpmip/platform-backend
    tag: dt4h
    pullPolicy: Always
  config:
    logLevel: INFO
    logLevelFramework: INFO
    algorithmUpdateInterval: 60
  persistence:
    data:
      localPath: /opt/mip-deployment/config
      size: 100Mi
    logs:
      localPath: /opt/mip-deployment/logs
      size: 1Gi

platformBackendDatabase:
  image:
    repository: postgres
    tag: 18.3-alpine
  persistence:
    localPath: /opt/mip-deployment/.stored_data/platform_backenddb
    size: 1Gi

keycloak:
  enabled: true
  host: inb.bsc.es
  protocol: https
  realm: datatools4heart
  clientId: mip_datacatalogue
  sslRequired: external
  proxyAddressForwarding: true
