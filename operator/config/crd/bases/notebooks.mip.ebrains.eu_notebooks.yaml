---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: notebooks.notebooks.mip.ebrains.eu
spec:
  group: notebooks.mip.ebrains.eu
  names:
    kind: Notebook
    listKind: NotebookList
    plural: notebooks
    singular: notebook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Notebook is one JupyterHub single-user server. The hub creates Secret
          <name>-<uid>-token (key "token", owned by the Notebook) with its API token.
          The API server assigns the UID, so no Secret that existed before the
          Notebook, such as one left by an earlier Notebook of the same name, is ever
          mounted. Names are jupyter-* and at most 57 characters, as the hub makes them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NotebookSpec is what JupyterHub asks for. Everything that decides what runs
              (image, resources, volumes, security) comes from the referenced profile.
            properties:
              env:
                additionalProperties:
                  type: string
                description: |-
                  Env holds the per-spawn JupyterHub variables. Only JUPYTERHUB_* and JPY_*
                  names are accepted; the API token comes from the Notebook's token Secret.
                type: object
                x-kubernetes-validations:
                - message: env keys must match ^(JUPYTERHUB|JPY)_[A-Z0-9_]+$
                  rule: self.all(k, k.matches('^(JUPYTERHUB|JPY)_[A-Z0-9_]+$'))
                - message: the API token comes from the Notebook's token Secret
                  rule: '!(''JUPYTERHUB_API_TOKEN'' in self) && !(''JPY_API_TOKEN''
                    in self)'
              profile:
                description: Profile is the name of a NotebookProfile in the same
                  namespace.
                minLength: 1
                type: string
              serverName:
                description: ServerName is the JupyterHub named server, empty for
                  the default server.
                type: string
              user:
                description: User is the JupyterHub user name. It names the home PVC.
                maxLength: 253
                minLength: 1
                type: string
            required:
            - profile
            - user
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; delete and recreate the Notebook
              rule: self == oldSelf
          status:
            description: NotebookStatus is the observed state of the notebook pod.
            properties:
              message:
                description: Message is the latest human readable reason, shown on
                  the spawn page.
                type: string
              phase:
                enum:
                - Pending
                - Running
                - Failed
                type: string
              url:
                description: URL is where the hub proxy reaches the notebook server,
                  set when Running.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must start with jupyter- and be at most 57 characters
          rule: self.metadata.name.startsWith('jupyter-') && size(self.metadata.name)
            <= 57
    served: true
    storage: true
    subresources:
      status: {}
