# Test fixture, not deployed: the deployed policy is mip-jupyterhub-secrets in mip-infra
# base/mip-infrastructure/notebook-operator/rbac.yaml. Change both together.
#
# The hub (operator mode) and the spawn API (operator-api mode) need
# `secrets: create` for the token Secrets. Unchecked, that would let a
# compromised one create a kubernetes.io/service-account-token Secret, which the
# API server fills with any ServiceAccount's token, under the name the operator
# mounts. The hub match goes once every federation runs operator-api.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mip-jupyterhub-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
  matchConditions:
    - name: token-secret-creators
      expression: >-
        request.userInfo.username.matches('^system:serviceaccount:federation-[^:]+:jupyterhub$') ||
        request.userInfo.username ==
        'system:serviceaccount:mip-notebooks-system:mip-notebook-spawn-api'
  variables:
    - name: owners
      expression: 'has(object.metadata.ownerReferences) ? object.metadata.ownerReferences
        : []'
  validations:
    - expression: "!has(object.type) || object.type == 'Opaque'"
      message: only Opaque Secrets may be created
    - expression: >-
        variables.owners.size() == 1 &&
        variables.owners[0].apiVersion.startsWith('notebooks.mip.ebrains.eu/') &&
        variables.owners[0].kind == 'Notebook'
      message: the token Secret must be owned by its Notebook
    # The name the operator mounts for that Notebook and no other.
    - expression: >-
        has(object.metadata.name) && variables.owners.size() == 1 &&
        variables.owners[0].name.startsWith('jupyter-') &&
        object.metadata.name == variables.owners[0].name + '-' + variables.owners[0].uid
        + '-token'
      message: >-
        only the token Secret <notebook>-<uid>-token of the jupyter-* Notebook that
        owns it may be created
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mip-jupyterhub-secrets
spec:
  policyName: mip-jupyterhub-secrets
  validationActions: [Deny]
